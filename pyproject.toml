[project]
name = "netevolve"
version = "0.1.0"
description = "Adaptive Open-Set Network Traffic Classification with Novel Class Discovery and Incremental Learning"
requires-python = ">=3.10,<3.12"
readme = "README.md"

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.flake8]
max-line-length = 100
exclude = [".venv", "__pycache__", "notebooks", ".ipynb_checkpoints"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
